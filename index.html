<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 🤍</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e8,#fff8fb);
font-family:Arial,sans-serif;
overflow:hidden;
}

.card{
background:white;
padding:35px;
border-radius:25px;
width:320px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.15);
}

h1{
color:#ff5d8f;
}

button{
margin-top:20px;
padding:12px 22px;
border:none;
border-radius:30px;
background:#ff5d8f;
color:white;
font-size:16px;
cursor:pointer;
}

#msg{
display:none;
margin-top:20px;
line-height:1.7;
color:#555;
animation:fade .6s;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.heart{
position:fixed;
font-size:20px;
animation:float 5s linear forwards;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-120vh);}
}
</style>

</head>

<body>

<div class="card">

<h1>🤍 For You</h1>

<p>There's something I want you to read...</p>

<button onclick="openLetter()">Open</button>

<div id="msg">

I'm really sorry.<br><br>

I know I hurt you.

I'm not here to justify anything.

I just hope someday you can understand how much you mean to me.

❤️

<br><br>

<button onclick="hearts()">Can We Start Again?</button>

</div>

</div>

<script>

function openLetter(){
document.getElementById("msg").style.display="block";
}

function hearts(){

for(let i=0;i<35;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="🤍";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(h);

setTimeout(()=>h.remove(),6000);

}

}

</script>

</body>
</html>
