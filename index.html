<!DOCTYPE html>
<html>
<head>
<title>For You 💗</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins&display=swap');

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(135deg,#ffd6e8,#fff5f8);
font-family:Poppins,sans-serif;
}


/* floating hearts */

.heart{
position:absolute;
font-size:25px;
animation:float 5s infinite;
opacity:.7;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-20vh);}
}


/* card */

.container{
width:350px;
background:#fffafa;
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,.15);
animation:show 1.5s;
}

@keyframes show{
from{
transform:scale(.7);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}


h1{
font-family:'Cormorant Garamond',serif;
font-size:45px;
color:#c65b86;
}


p{
color:#555;
line-height:1.8;
}


button{
background:#d96b9b;
color:white;
border:none;
padding:13px 30px;
border-radius:30px;
font-size:15px;
cursor:pointer;
margin-top:20px;
}


button:hover{
transform:scale(1.05);
}


/* popup */

.popup{
display:none;
position:fixed;
top:0;
left:0;
height:100%;
width:100%;
background:rgba(0,0,0,.3);
justify-content:center;
align-items:center;
}


.popup-box{
background:white;
padding:35px;
border-radius:25px;
width:300px;
text-align:center;
animation:pop .5s;
}


@keyframes pop{
from{
transform:scale(0);
}
to{
transform:scale(1);
}
}

</style>

</head>


<body>


<div class="heart" style="left:10%">💗</div>
<div class="heart" style="left:30%;animation-delay:1s">✨</div>
<div class="heart" style="left:70%;animation-delay:2s">💗</div>
<div class="heart" style="left:85%;animation-delay:3s">🌸</div>



<div class="container">

<h1>I'm Sorry 💌</h1>

<p id="text"></p>


<button onclick="openPopup()">
Open My Heart 🤍
</button>

</div>



<div class="popup" id="popup">

<div class="popup-box">

<h2>For You 🫶</h2>

<p>
I know I made mistakes and I am truly sorry.
I never wanted to hurt you.
Please understand my feelings and know that you matter a lot to me.
</p>


<button onclick="closePopup()">
Close 💗
</button>


</div>

</div>



<script>


let message=
"I am sorry for the moments where I hurt you. I wish I could explain everything better. I just want you to know that I care and I never wanted to make you feel bad.";

let i=0;


function typing(){

if(i<message.length){

document.getElementById("text").innerHTML += message.charAt(i);

i++;

setTimeout(typing,40);

}

}

typing();



function openPopup(){

document.getElementById("popup").style.display="flex";

}


function closePopup(){

document.getElementById("popup").style.display="none";

}


</script>


</body>
</html>
